name: バグ報告
description: 期待と異なる挙動を報告する
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何がおかしいか。1〜2行で
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. アプリを起動する
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      description: 端末・OS バージョン・ビルド種別(分かる範囲で)
      placeholder: "例: OS / バージョン / ビルド種別"
  - type: textarea
    id: evidence
    attributes:
      label: スクリーンショット・ログ
  - type: checkboxes
    id: regression
    attributes:
      label: 全体リグレッション
      description: 直すと複数機能にまたがる大きな変更になるなら付ける。PR で全フローと手動チェックリストを確認する(テスト戦略の決定)
      options:
        - label: 全体リグレッションが要る
  - type: textarea
    id: docs
    attributes:
      label: 関係するドキュメント
      description: "関係する仕様: docs/specs/〈ファイル〉。仕様と実装のどちらが正しいか決まらないなら OQ を起票する"
